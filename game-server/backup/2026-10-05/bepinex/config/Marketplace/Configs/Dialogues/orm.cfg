Text: Et maintenant ? | Condition: CustomValueMore, cendre_etape, 7 | AlwaysVisible: false | Transition: orm_fin
Text: Je ne fais que passer. | Transition: orm_bye

[cendre_asksvin_offre]
Les asksvins courent partout et mordent tout ce qui bouge. 4 d'entre eux, et fais vite, ils sont rapides.
Text: C'est parti ! | Command: GiveQuest, cendre_asksvin
Text: Plus tard.

[cendre_voltures_offre]
Les vautours tournent au-dessus de ma tête en attendant que je meure. 4 d'entre eux, pour qu'ils arrêtent d'espérer.
Text: C'est parti ! | Command: GiveQuest, cendre_voltures
Text: Plus tard.

[cendre_calcines_offre]
Des guerriers calcinés patrouillent partout. 8 d'entre eux, et vise les jambes, ils ne sont pas très solides.
Text: C'est parti ! | Command: GiveQuest, cendre_calcines
Text: Plus tard.

[cendre_mages_offre]
3 archers calcinés et 2 mages calcinés. Garde ton bouclier levé, ils visent bien. Pour des squelettes brûlés.
Text: C'est parti ! | Command: GiveQuest, cendre_mages
Text: Plus tard.

[cendre_valkyrie_offre]
Une Valkyrie déchue plane au-dessus des forteresses. Abats-la. Ses plumes valent de l'or.
Text: C'est parti ! | Command: GiveQuest, cendre_valkyrie
Text: Plus tard.

[cendre_fader_offre]
Fader, le dragon de feu, règne sur les Terres cendrées. C'est le dernier combat. Prépare-toi bien, et reviens entier.
Text: C'est parti ! | Command: GiveQuest, cendre_fader
Text: Plus tard.

[orm_merci]
Ingrid t'envoie ? Elle a enfin trouvé ce qu'elle cherchait ? Toujours pas ? Bon, au travail, il fait chaud.
Text: Je t'écoute. | Transition: cendre_asksvin_offre
Text: Plus tard. | Transition: orm_bye

[orm_bravo]
Beau travail ! Voilà ta récompense. Reviens me voir, la liste est encore longue.
Text: Merci !

[orm_fin]
Fader est tombé ! Tu as conquis toutes les terres connues. Il ne reste plus que le Grand Nord... mais personne n'en est jamais revenu pour raconter. Bravo, héros.
Text: Merci !

[orm_bye]
Ne touche pas la lave. Je sais, c'est tentant. Ne la touche pas.
Text: Au revoir
