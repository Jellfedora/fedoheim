[tro_sanglier_offre]
Il manque une pièce à ma collection : une tête de sanglier. Il m'en faudrait 3. Tu me rapportes ça ?
Text: C'est parti ! | Command: GiveQuest, tro_sanglier
Text: Plus tard.

[tro_nixe_offre]
Il manque une pièce à ma collection : une tête de Nixe. Il m'en faudrait 3. Tu me rapportes ça ?
Text: C'est parti ! | Command: GiveQuest, tro_nixe
Text: Plus tard.

[tro_cerf_offre]
Il manque une pièce à ma collection : des bois de cerf. Il m'en faudrait 3. Tu me rapportes ça ?
Text: C'est parti ! | Command: GiveQuest, tro_cerf
Text: Plus tard.

[tro_eikthyr_offre]
La pièce maîtresse de toute collection de prairie : la tête d'Eikthyr ! Non, pas celle de la stèle, celle-là doit y rester. Tu devras le combattre une deuxième fois. Il va adorer.
Text: C'est parti ! | Command: GiveQuest, tro_eikthyr
Text: Plus tard.

[ragna_stele]
Oh, la tête d'Eikthyr ! Magnifique... mais non, ne me la donne pas, elle n'est pas pour mon mur. Sa place est sur la stèle des anciens, au sud-est d'ici. Tu verras quatre petites îles : la stèle est sur l'une d'elles. Laquelle ? Aucune idée, je n'ai pas de carte. Personne n'a de carte. Bonne baignade !
Text: Merci, Ragna !

[ragna_bravo]
Magnifique ! Ça va être superbe sur mon mur. Tiens, pour ta peine.
Text: Merci !

[ragna_fin]
Ma collection des trophées de la Prairie est complète ! Merci, tu es le meilleur fournisseur de têtes coupées que je connaisse.
Text: Merci !

[ragna_bye]
Reviens avec des trophées, et pas les tiens de préférence.
Text: Au revoir
