# Port trader dialogue — random talk
msg_randomPortTalk_1: "Ahh, encore un grand échalas qui veut mes bateaux ? Trébuche pas sur le ponton, l'humain."
msg_randomPortTalk_2: "Les pièces d'abord, la cargaison ensuite. C'est la loi de la mer, et la loi de ma barbe !"
msg_randomPortTalk_3: "Des marchandises à transporter ? Mes bateaux filent plus vite que l'odeur d'un troll sous le vent."
msg_randomPortTalk_4: "Les humains veulent toujours qu'on livre hier. Coup de chance : mes bateaux de demain partent aujourd'hui !"
msg_randomPortTalk_5: "Tu paies, je transporte. Simple comme un coup de marteau, en moins bruyant."
msg_randomPortTalk_6: "Pas touche aux tonneaux de rhum ! C'est pour l'équipage, pas pour la cargaison."
msg_randomPortTalk_7: "Par ma barbe, j'ai transporté plus lourd que toi ! T'en fais pas, ta cargaison arrivera."
msg_randomPortTalk_8: "Des ports, des manifestes et des pièces. Voilà ma vie. Et la tienne, l'humain ?"

# Port trader dialogue — greets
msg_randomGreet_1: "Bien le bonjour, grand échalas ! Tu viens envoyer tes trésors de l'autre côté de la mer ?"
msg_randomGreet_2: "Har ! Encore un client ! Attention aux cordages, ils font trébucher les grands comme toi."
msg_randomGreet_3: "Un bon vent souffle, et les bonnes affaires aussi... si t'as les pièces."
msg_randomGreet_4: "Par ma barbe, t'as l'air fourbu. Coup de chance, le voyage, c'est mon métier."
msg_randomGreet_5: "Remue-toi, l'humain ! Mon quai, c'est pas un endroit pour rêvasser."
msg_randomGreet_6: "Bonne journée à toi ! T'as de la cargaison ? J'ai des bateaux."
msg_randomGreet_7: "Ah, l'odeur des pièces dans la brise. T'as des affaires à régler, hein ?"
msg_randomGreet_8: "Bienvenue dans mon port ! Touche à rien de brillant, sauf si tu l'achètes."

# Port trader dialogue — goodbyes
msg_randomGoodbye_1: "Bon vent, et coule pas mes bénéfices !"
msg_randomGoodbye_2: "Allez, file ! Mes bateaux vont pas se charger tout seuls."
msg_randomGoodbye_3: "Bon voyage, grand échalas. Dépense plus la prochaine fois !"
msg_randomGoodbye_4: "Méfie-toi de la mer, elle est plus agitée que mon oncle après trois chopes."
msg_randomGoodbye_5: "La cargaison n'attend personne. Circule !"
msg_randomGoodbye_6: "À la prochaine marée, et que tes bottes restent sèches."
msg_randomGoodbye_7: "Reviens nous voir. Mais pas en tant que débiteur."
msg_randomGoodbye_8: "Au revoir, et que ta barbe pousse aussi fort que ta bourse."
