Text: Et maintenant ? | Condition: CustomValueMore, bjorn_etape, 6 | AlwaysVisible: false | Transition: bjorn_suite
Text: Je ne fais que passer. | Transition: bjorn_bye

[bjorn_sangliers_offre]
L'hiver approche et le garde-manger sonne creux. Il me faut 5 sangliers. Pas besoin de les ramener entiers, juste... morts.
Text: C'est parti ! | Command: GiveQuest, bjorn_sangliers
Text: Plus tard. | Transition: bjorn_bye

[bjorn_necks_offre]
Des Nixes squattent la rivière et mordent les chevilles de tout le monde. Élimine-en 5, tu veux ?
Text: C'est parti ! | Command: GiveQuest, bjorn_necks
Text: Plus tard. | Transition: bjorn_bye

[bjorn_greylings_offre]
Les bourgeons nains gris me volent mon bois pendant que je dors. Débarrasse-moi de 8 de ces petites horreurs.
Text: C'est parti ! | Command: GiveQuest, bjorn_greylings
Text: Plus tard. | Transition: bjorn_bye

[bjorn_cerfs_offre]
Pour le prochain combat, il me faut des bois de cerf. Chasse 3 cerfs. Ils courent vite, sois plus malin qu'eux.
Text: C'est parti ! | Command: GiveQuest, bjorn_cerfs
Text: Plus tard. | Transition: bjorn_bye

[bjorn_eikthyr_offre]
Tu es prêt. Enfin, je crois. L'autel d'Eikthyr se trouve à environ 300 mètres à l'est d'ici, suis le soleil levant. Et si tu te perds, cherche un Vegvisir : une grande pierre gravée de runes qui brille d'une lueur rouge. Pose la main dessus et ton regard se tournera tout seul vers l'autel. Ensuite, marche droit devant. C'est ce qu'on a de plus proche d'une carte, par ici. Vas-y et invoque Eikthyr, le grand cerf qui crache des éclairs. Si tu reviens vivant, je te paie une tournée.
Text: C'est parti ! | Command: GiveQuest, bjorn_eikthyr
Text: Plus tard. | Transition: bjorn_bye

[bjorn_merci]
Ah, enfin des bras ! Bienvenue au Village des âmes perdues. Et tu l'as trouvé sans carte, chapeau. Tiens, voilà 20 pièces pour la peine, Sigrid m'a dit de bien t'accueillir. Et puisque tu es là... j'aurais bien du travail pour toi.
Text: Je t'écoute. | Transition: bjorn_sangliers_offre
Text: Plus tard. | Transition: bjorn_bye

[bjorn_bravo]
Beau travail ! Tiens, ta récompense. Reviens me voir quand tu veux, j'ai toujours quelque chose sur le feu. Littéralement : c'est une cuisine.
Text: Merci, Bjorn !

[bjorn_bravo_eikthyr]
Tu l'as eu ! Le grand cerf ! Tiens, ta tournée, comme promis. Et garde bien sa tête : Ragna la taxidermiste saura te dire où la porter. Ah, et cette clé aussi : elle ouvre les portails de la Prairie. Garde-la précieusement, elle ne s'use pas, mais personne ne t'en fera une autre.
Text: Merci, Bjorn !

[bjorn_suite]
La prairie, c'est fini pour toi, tu es trop fort pour nos sangliers. Va voir Hilda la Bûcheronne, à l'orée de la Forêt noire. C'est elle qui me fournit le bois pour mes fourneaux, alors sois gentil avec elle. Tu ne peux pas la rater. Enfin, sans carte, tu peux, mais essaie quand même.
Text: J'y vais !

[bjorn_bye]
Passe ton chemin alors, mais pas les doigts dans ma marmite.
Text: Au revoir
