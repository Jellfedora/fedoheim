Text: Je ne fais que passer. | Transition: gunnar_bye

[marais_draugrs_offre]
Les draugrs sortent de la vase comme des champignons. Des champignons armés. Abats-en 8.
Text: C'est parti ! | Command: GiveQuest, marais_draugrs
Text: Plus tard.

[marais_sangsues_offre]
Je n'ose plus prendre de bain à cause des sangsues. Tue-en 5. Après, je prendrai peut-être un bain. Peut-être.
Text: C'est parti ! | Command: GiveQuest, marais_sangsues
Text: Plus tard.

[marais_blobs_offre]
Des flaques de gelée verte qui rebondissent et crachent du poison. 6 de moins, et le marais sera plus propre. Un peu.
Text: C'est parti ! | Command: GiveQuest, marais_blobs
Text: Plus tard.

[marais_elites_offre]
Il y a des draugrs encore plus grands et plus méchants. 3 draugrs d'élite. Bonne chance, et ne compte pas sur moi pour venir t'aider.
Text: C'est parti ! | Command: GiveQuest, marais_elites
Text: Plus tard.

[marais_abomination_offre]
Ce que tu prends pour un tas de racines se lève et t'écrase. C'est une abomination. Tue-la avant qu'elle ne te prenne pour un tapis.
Text: C'est parti ! | Command: GiveQuest, marais_abomination
Text: Plus tard.

[marais_bonemass_offre]
Masse d'os, l'horreur du marais. Un tas de chair et d'os qui empoisonne tout. Une masse et des potions anti-poison, voilà ce qu'il te faut.
Text: C'est parti ! | Command: GiveQuest, marais_bonemass
Text: Plus tard.

[gunnar_merci]
Hilda t'envoie ? Elle a dû te dire que je sentais mauvais. C'est faux, c'est le marais. Bon, en partie. J'ai du boulot pour toi.
Text: Je t'écoute. | Transition: marais_draugrs_offre
Text: Plus tard. | Transition: gunnar_bye

[gunnar_bravo]
Beau travail ! Voilà ta récompense. Reviens me voir, la liste est encore longue.
Text: Merci !

[gunnar_fin]
Masse d'os est tombée ! Le marais respire... enfin, autant qu'un marais peut respirer. Pour la suite, monte voir Astrid la Givrée dans les Montagnes. Prends un manteau.
Text: Merci !

[gunnar_bye]
Va, et méfie-toi des sangsues. Elles sont collantes. Comme Hilda.
Text: Au revoir
