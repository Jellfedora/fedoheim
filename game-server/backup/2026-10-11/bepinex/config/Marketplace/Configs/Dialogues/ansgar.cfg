[ansgar_accueil]
Par tous les dieux... quelqu'un ! Un vivant ! Tu as réussi à passer ces squelettes devant la porte ? Je suis frère Ansgar, le dernier survivant de la paroisse. Les autres... les squelettes les ont eus. Quant à frère Keli le Bon, il a pris ses jambes à son cou dès le premier cliquetis. Le Bon, tu parles ! Ça fait des semaines que je suis enfermé ici. Oh, que je suis content de te voir !
Text: Gudrun m'envoie avec des offrandes. | Condition: HasQuest, eglise_offrandes | Condition: HasItem, Raspberry, 10 | Condition: HasItem, Honey, 5 | AlwaysVisible: false | Command: FinishQuest, eglise_offrandes | Command: SetCustomValue, eglise_etape, 1 | Transition: ansgar_merci
Text: Tu as besoin d'aide ? | Condition: CustomValueMore, eglise_etape, 1 | Condition: !CustomValueMore, eglise_etape, 2 | Condition: NotHasQuest, eglise_defense | AlwaysVisible: false | Transition: ansgar_alerte
Text: Les squelettes ont disparu... | Condition: HasQuest, eglise_defense | Condition: QuestProgressNotDone, eglise_defense | AlwaysVisible: false | Transition: ansgar_retour
Text: Ils sont tous tombés ! | Condition: HasQuest, eglise_defense | Condition: QuestProgressDone, eglise_defense | AlwaysVisible: false | Command: FinishQuest, eglise_defense | Command: SetCustomValue, eglise_etape, 2 | Transition: ansgar_bravo
Text: Et maintenant ? | Condition: CustomValueMore, eglise_etape, 2 | Condition: !CustomValueMore, eglise_etape, 3 | Condition: NotHasQuest, eglise_keli | AlwaysVisible: false | Transition: ansgar_keli_offre
Text: Toujours aucune trace de Keli... | Condition: HasQuest, eglise_keli | AlwaysVisible: false | Transition: ansgar_keli_rappel
Text: Et maintenant ? | Condition: CustomValueMore, eglise_etape, 3 | AlwaysVisible: false | Transition: ansgar_fin
Text: Je ne fais que passer. | Transition: ansgar_bye

[ansgar_merci]
Des framboises ! Et du miel ! Que les dieux bénissent Gudrun, et toi aussi. Je vais enfin manger autre chose que de la soupe de racines. Tiens, pour ta peine.
Text: Avec plaisir.

[ansgar_alerte]
Aide-moi, je t'en supplie ! Tu les as vus, ces squelettes devant la paroisse ? Voilà pourquoi personne ne m'a revu depuis des semaines : je n'ose plus sortir. On a beau les abattre, ils reviennent toujours... Écoute ! Les voilà, et ils sont nombreux cette fois ! J'espère que tu n'es pas venu seul...
Text: On s'en occupe ! | Command: GiveQuest, eglise_defense | Command: SpawnXYZ, Skeleton, 5, 0, -488, 53, -368, 5 | Command: SpawnXYZ, Skeleton, 5, 0, -548, 53, -368, 5 | Command: SpawnXYZ, Skeleton, 5, 0, -518, 53, -338, 5 | Command: SpawnXYZ, Skeleton, 5, 0, -518, 53, -398, 5
Text: Euh... plus tard ?

[ansgar_retour]
Disparus ? Ils rôdent encore, je les entends... Les voilà qui reviennent ! Courage, mon enfant !
Text: À l'attaque ! | Command: SpawnXYZ, Skeleton, 1, 0, -488, 53, -368, 5 | Command: SpawnXYZ, Skeleton, 1, 0, -548, 53, -368, 5 | Command: SpawnXYZ, Skeleton, 1, 0, -518, 53, -338, 5
Text: Je reviens plus tard.

[ansgar_bravo]
Tu as sauvé la paroisse ! Pour te remercier, je vais te confier notre relique : une tête de hache trouvée par nos anciens. On raconte qu'elle ne sera jamais complète seule... Peut-être trouveras-tu sa jumelle. Prends-en soin.
Text: Merci, frère Ansgar !

[ansgar_keli_offre]
Maintenant que les squelettes sont partis... il faudrait retrouver frère Keli le Bon. Il s'est enfui dès le premier cliquetis, en hurlant. Mais rassure-toi : Keli n'est pas très sportif. Il ne doit pas être bien loin. Cherche autour de la paroisse, il s'est sûrement caché dans le premier buisson venu.
Text: Je vais le chercher. | Command: GiveQuest, eglise_keli
Text: Plus tard.

[ansgar_keli_rappel]
Il ne peut pas être allé bien loin, crois-moi. La dernière fois que Keli a couru, c'était après une part de gâteau. Et il ne l'a pas rattrapée.
Text: Je continue de chercher.

[ansgar_fin]
Grâce à toi, la paroisse est en sécurité, et Keli est sain et sauf. Pour l'instant. Si tu entends encore des cliquetis, ce sera sûrement mes genoux.
Text: Merci !

[ansgar_bye]
Que les dieux guident tes pas.
Text: Au revoir
