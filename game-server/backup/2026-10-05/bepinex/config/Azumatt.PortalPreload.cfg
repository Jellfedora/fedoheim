## Settings file was created by plugin PortalPreload v1.2.1
## Plugin GUID: Azumatt.PortalPreload

[General]

## If on, the mod preloads portal destinations.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
EnablePreloading = On

## If on, the teleportation is faster.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
EnableFasterTeleport = On

[Preloading]

## How many portal destinations can be loaded at once. The portals you are closest to and looking at win. Keeps big portal rooms from loading every destination together.
# Setting type: Int32
# Default value: 2
# Acceptable value range: From 1 to 8
MaxPreloadedPortals = 2

## How close you need to be to a portal, in metres, before its destination starts loading.
# Setting type: Single
# Default value: 15
# Acceptable value range: From 5 to 40
PreloadRadius = 15

## Largest ring of zones loaded around a destination. 1 = 3x3 zones, 2 = 5x5, 3 = 7x7.
# Setting type: Int32
# Default value: 2
# Acceptable value range: From 1 to 3
MaxZoneRadius = 2

[Preview]

## If on, portals show a live view of their destination.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
EnablePreview = On

## How close you need to be to a portal, in metres, to see through it.
# Setting type: Single
# Default value: 12
# Acceptable value range: From 3 to 40
PreviewDistance = 12

## Most portals showing a view at the same time. The nearest ones win.
# Setting type: Int32
# Default value: 4
# Acceptable value range: From 1 to 16
MaxVisiblePreviews = 4

## The nearest portal updates every frame. This many of the others update per frame on top of that, taking turns.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 0 to 8
ExtraRendersPerFrame = 1

## Updates per second while your view of a portal isn't moving, for creatures, fire and water on the far side. 0 = only update when you move.
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 0 to 144
IdleRefreshRate = 20

## Largest texture a portal view renders at, in pixels. Views are sized to how big the portal is on your screen, this caps it.
# Setting type: Int32
# Default value: 1536
# Acceptable value range: From 256 to 4096
MaxResolution = 1536

## View resolution relative to the portal's size on your screen. 1 = pixel for pixel. Above 1 renders extra detail and shrinks it down (supersampling), which gets rid of grain and jagged edges at a cost. 1.5 is a good sharp setting.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,25 to 2
ResolutionScale = 1

## While views are showing and the game runs below this frame rate, views lower their resolution (down to 40%) and update less, then sharpen back up once it recovers. 0 = off, always full quality.
# Setting type: Int32
# Default value: 50
# Acceptable value range: From 0 to 240
AdaptiveTargetFPS = 50

## If on, views are filtered like a normal game texture (mipmaps, trilinear, anisotropic). Smoother, and needed for ResolutionScale above 1 to look its best.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
SmoothFiltering = On

## How far the view draws on the far side, in metres.
# Setting type: Single
# Default value: 400
# Acceptable value range: From 50 to 2000
DrawDistance = 400

## How far past the portal the view draws shadows, in metres. Shadows are the most expensive part of a view. 0 turns them off.
# Setting type: Single
# Default value: 40
# Acceptable value range: From 0 to 150
ShadowDistance = 40

## If on, grass is grown around the far side of the nearest portal view. The game normally only grows it around you.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Grass = On

## If on, the dark swirl and blue flames of the vanilla portal effect are hidden while a view is showing. The sparks, runes, glow and sound stay.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
HideVanillaSwirl = On

## How the view looks. Clear = the plain live render. Wavy = ripples rolling across it like water. CrystalBall = the middle magnified like a glass orb, with a dark glassy rim. Ethereal = a slow warm-air drift with a misty blue edge. Shield = a rippling force field bubble over it, using the game's own ForceField material.
# Setting type: ViewStyle
# Default value: Clear
# Acceptable values: Clear, Wavy, CrystalBall, Ethereal, Shield
Style = Clear

## How a view opens when you walk up to a portal. Fade = fades in. Iris = opens from the middle out. Spiral = opens from the middle with a swirling edge.
# Setting type: RevealStyle
# Default value: Iris
# Acceptable values: Fade, Iris, Spiral
Reveal = Iris

## How strongly the style bends the view. 1 = default.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 3
StyleStrength = 1

## If on, views are lit with the weather, fog and light of the destination's biome instead of yours.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
DestinationWeather = On

[TargetPortal]

## Only matters with TargetPortal installed. If on, resting the mouse on a portal on the destination map loads it and shows a live view of it next to the cursor, and the jump is near instant once it has loaded. Portals always remember where you last went from them and show that view.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
MapPreview = On

[Traversal]

## If on, arrows, bolts, spears and spells fly through a portal whose destination is loaded and come out the other side with the same speed and direction. Synced from the server.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Projectiles = On

## If on, dropped or thrown items that go into a portal whose destination is loaded come out the other side still moving. Items the portal would not let you carry (ore and the like) just fall through the frame like normal. Synced from the server.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Items = On

## Which creatures walk through a portal whose destination is loaded. Off = none. Tames = only tamed ones. NotHostile = tames, wild animals like deer, and anything that won't attack you (Dvergr). All = everything, monsters included. Bosses and anything being ridden never go through. Synced from the server.
# Setting type: CreatureTraversal
# Default value: NotHostile
# Acceptable values: Off, Tames, NotHostile, All
Creatures = NotHostile

## If on, creatures spawn around a portal's loaded destination as if you were standing at it, so there is something alive on the other side. Off = the far side only has what was already there. Synced from the server.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
SpawnAtDestination = On

