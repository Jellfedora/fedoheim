[peche_perches_offre]
Tiens, une canne et des appâts. Lance la ligne dans l'eau, attends, tire. Rapporte-moi 3 perches de la prairie. C'est facile, même un nain gris y arriverait.
Text: C'est parti ! | Command: GiveQuest, peche_perches | Command: GiveItem, FishingRod, 1, 1 | Command: GiveItem, FishingBait, 20, 1
Text: Plus tard.

[peche_brochets_offre]
Les brochets vivent dans les eaux de la Forêt noire. Rapporte-m'en 2. Ils mordent, fais attention à tes doigts.
Text: C'est parti ! | Command: GiveQuest, peche_brochets
Text: Plus tard.

[peche_trolls_offre]
Le poisson-troll vit dans les eaux des Marais. Il est moche, mais il est bon. Rapporte-m'en 2.
Text: C'est parti ! | Command: GiveQuest, peche_trolls
Text: Plus tard.

[olaf_bravo]
Belle prise ! Tiens, ta récompense. Et lave-toi les mains, tu sens le poisson.
Text: Merci !

[olaf_fin]
Tu as l'étoffe d'un pêcheur ! Pour aller plus loin, va voir Sven le Harponneur. Il pêche des choses plus grosses. Beaucoup plus grosses.
Text: Merci !

[olaf_bye]
Reviens quand tu auras quelque chose au bout de ta ligne.
Text: Au revoir
