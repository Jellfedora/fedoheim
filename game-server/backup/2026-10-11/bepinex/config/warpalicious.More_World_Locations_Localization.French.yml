# Marble Jail 1
mwl_marblejail1_key: Clé de la prison de marbre
mwl_marblejail1_key_desc: Une clé en fer rouillé, usée par le temps. Elle ouvre le bloc des cellules.
mwl_marblejail1_runestone: Fin sinistre
mwl_marblejail1_runestone_text: "Ils m'ont oublié ici. Les années sont devenues des décennies. Les créatures d'en bas me sont devenues familières : leurs hurlements, ma seule compagnie. Je vais les rejoindre maintenant. Elles m'attendaient, elles. Personne d'autre ne l'a fait."

# Marble Cliff Altar 1
mwl_marblecliffaltar1_runestone: Acquisition dangereuse
mwl_marblecliffaltar1_runestone_text: "Ce qui repose sur l'autel ne t'appartient pas. Il appartient à ceux qui tournoient là-haut, qui attendent en silence. Prends-le, et une corne mortelle brisera le silence de la brume."

# Port Runestones
mwl_port1_runestone: Le vol de Drelthor
mwl_port1_runestone_text: "Maudit soit Drelthor le Cupide, roi des Dvergrs à l'Âge d'or. Car c'est lui qui, avide de savoir, déroba l'Œil d'Odin dans le puits de Mímir. Les eaux profanées empoisonnèrent Yggdrasil : ses pousses tombèrent malades sur Valheim, et Odin lui-même entra dans une colère noire."

mwl_port2_runestone: Nous sommes Dvergrs
mwl_port2_runestone_text: "Maudit soit Drelthor le Cupide ! Nos grandes civilisations ont mis mille ans à s'élever et un instant à tomber. Nos cités, nos comptoirs, nos forteresses et nos fermes, tous ravagés par les réprouvés. Pourquoi, alors, persistons-nous ? À quoi bon entretenir nos petites forteresses et nos campements en ces temps sans espoir ? Parce que nous sommes Dvergrs ! Et même la colère d'Odin n'aura pas raison de nous. Nous survivrons. Nous rebâtirons. Nous regagnerons la faveur d'Odin. Nous ferons naître un nouvel âge d'or."

mwl_port3_runestone: Les graines d'une ère nouvelle
mwl_port3_runestone_text: "Pourquoi entretenir ces ports, vestiges d'une grande époque révolue ? Ils ne servent à rien, si ce n'est à gagner quelques pièces avec les voyageurs de passage. Parce que nous en aurons besoin quand nous rebâtirons ! Quand les grandes nations dvergrs se relèveront, il nous faudra du commerce et des échanges ! Ce sont les graines d'une ère nouvelle, et elles fleuriront !\n\nAh, et maudit soit Drelthor le Cupide."

mwl_port4_runestone: Royaumes en ruine
mwl_port4_runestone_text: "Maudit soit Drelthor le Cupide, qui plongea nos prospères nations dvergrs dans la ruine en provoquant Odin. Le Père de tous jeta ses réprouvés les plus infâmes et ses âmes perdues dans notre royaume, pour les punir eux, et nous avec. Nos royaumes s'effondrèrent. Nos terres jadis vibrantes se couvrirent de brume et de feu. Notre peuple fut dispersé, sans chef."

mwl_port5_runestone: La complainte de Drelthor
mwl_port5_runestone_text: "Je suis Drelthor, jadis roi des Dvergrs. Dans mon arrogance, j'ai volé l'Œil d'Odin et provoqué notre ruine. L'ironie, c'est que l'Œil m'a donné la sagesse de comprendre que je n'aurais jamais dû le voler. Si seulement je pouvais réparer ma faute ! Mais c'est fait. Il ne me reste plus qu'à errer sans fin. Car l'Œil m'a aussi condamné à l'immortalité, pour que je contemple à jamais la souffrance de mon peuple et la destruction de tout ce sur quoi je régnais.\n\nMaudit sois-je."

# Forbidden Catacombs
mwl_forbiddencatacombs_runestone_text: "Quand les jarls mouraient, on les couchait là-haut, drapés d'or, intouchés par le temps. En bas, les petites gens, les ouvriers, les sans-bouclier, pourrissaient dans l'ombre, leurs tombes marquées par la puanteur et le chagrin. Avec le temps, la pourriture se répandit, et un grand mage intervint : il scella les profondeurs pour arrêter la décomposition. Seule la couronne creuse d'un jarl peut briser le sceau et rouvrir le passage."

