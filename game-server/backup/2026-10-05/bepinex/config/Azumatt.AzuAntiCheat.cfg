Lock Configuration = On

## Ask a player to save their character before removing them for a setup problem, such as a missing mod or a version mismatch. Those players are usually blameless and Valheim's own autosave runs only every 30 minutes, so without this a kick can cost them half an hour. Players removed for an actual detection are never saved, whatever this is set to.
# Setting type: Boolean
# Default value: true
Save Character On Setup Kick = true

## Extra process names to treat as cheat tools, comma separated and matched as substrings. Developer tools that read game memory (x64dbg, Process Hacker, System Informer, HxD, ReClass, Cheat Engine forks) are deliberately not detected by default, because modders and streamers use them routinely.
# Setting type: String
# Default value: 
Additional Cheat Processes = 

## Process names and window titles that are never treated as cheat tools, comma separated and matched as substrings. This overrides every other detection, so it is the fix when something legitimate on your players' machines trips a check.
# Setting type: String
# Default value: 
Ignored Cheat Processes = 

## Diagnostics for stutter reports. Players log every frame over 100ms, whether the garbage collector ran, and what AzuAntiCheat last did, plus any of its own work over 5ms. Set on the server and pushed to every player, so it stays off everywhere unless an admin turns it on. Turn it on, collect the players' logs, turn it off. [Synced with Server]
# Setting type: Boolean
# Default value: false
Log Frame Hitches = false

## Close a detected cheat program on the player's machine as well as removing them from the server. Turn it off if you would rather only remove the player; detection and removal happen either way.
# Setting type: Boolean
# Default value: true
Terminate Detected Processes = true

