[keli_accueil]
Aaah ! Ne me frappe pas ! Je n'ai que des os... euh, non, j'ai de la chair, beaucoup de chair ! Ah... tu n'es pas un squelette. Ouf. Je suis frère Keli. Keli le Bon.
Text: Frère Ansgar m'envoie. | Condition: HasQuest, eglise_keli | AlwaysVisible: false | Command: FinishQuest, eglise_keli | Command: SetCustomValue, eglise_etape, 3 | Transition: keli_retrouve
Text: Et maintenant ? | Condition: CustomValueMore, eglise_etape, 3 | AlwaysVisible: false | Transition: keli_fin
Text: Pourquoi « le Bon » ? | Transition: keli_surnom
Text: Je ne fais que passer. | Transition: keli_bye

[keli_retrouve]
Ansgar est vivant ? Les dieux soient loués ! Et les squelettes sont partis ? Ah... j'ai honte. Je me suis enfui en emportant ça : la jumelle de notre relique, une autre tête de hache. Prends-la. Avec les deux, un bon forgeron saura en faire quelque chose. Moi, je saurais juste me couper les doigts.
Text: Merci, frère Keli.

[keli_fin]
Je rentrerai à la paroisse... bientôt. Demain. Peut-être. Quand je serai sûr qu'il n'y a plus un seul os qui traîne.
Text: Courage, Keli.

[keli_surnom]
Parce que je suis bon ! Bon cuisinier, bon chanteur, bon dormeur... Courir, par contre, ce n'est pas mon fort.
Text: Je vois ça.

[keli_bye]
Si tu croises un squelette, ne lui dis pas où je suis !
Text: Promis.
