# AzuAntiCheat client baseline.
#
# What a clean client looks like, so the server can recognize a modified one. A dedicated
# server ships different game assemblies than a client, so this cannot be taken from the
# server's own files. It is captured from the first admin to connect after a game update.
#
# Each platform gets its own entry (Steam/WindowsPlayer, Steam/LinuxPlayer, Steam/OSXPlayer). Native
# Linux, Steam Deck and Mac clients each run a separately compiled build, so their files never match
# Windows ones. Proton players count as Windows.
#
# Steam players' game files are checked against official hashes built into the mod whenever
# your game version is covered, and this file is not used for that. It is the fallback after
# a Valheim update until the mod catches up, and it always supplies the patcher list.
#
# You can edit this by hand, copy it between servers running the same game version, or
# delete an entry to have the next admin on that platform capture a fresh one.
#
# gameVersion is checked against the running game. After a Valheim update an entry stops
# applying and is replaced automatically, so there is nothing to redo by hand.

