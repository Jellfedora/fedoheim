[fjalar_accueil]
Hé hé hé ! Un visiteur ! Je suis Fjalar, mage, génie, et selon certains... un peu fou. Ils ont tort. Enfin, à moitié. Tu veux voir Haldor, le marchand ? Je peux t'y envoyer. Par magie. Le retour, par contre... ce sortilège-là, je l'ai oublié.
Text: Envoie-moi chez Haldor ! | Transition: fjalar_sur
Text: Comment ça, pas de retour ? | Transition: fjalar_retour
Text: Non merci, j'ai encore toute ma tête. | Transition: fjalar_bye

[fjalar_sur]
Tu es sûr ? Vraiment sûr ? Une fois là-bas, tu rentres à pied. Ou à la nage. Ou en pleurant. Et pas de minerai dans les poches : la magie, ça n'aime pas le métal, ça fait des étincelles.
Text: Oui, lance le sort ! | Command: Teleport, 3330, 42, 3712, false | Transition: fjalar_pouf
Text: Finalement, non. | Transition: fjalar_bye

[fjalar_pouf]
Abracadabr... non attends, c'était pas ça... ah si ! POUF !
Text: Aaaaaaah !

[fjalar_retour]
Le sort aller, je le connais par cœur. Le sort retour, je l'ai écrit sur un parchemin. Que j'ai mangé. Par erreur. C'était un mardi. Bref, tu rentreras à pied, comme tout le monde. Sans carte, évidemment.
Text: Bon, envoie-moi quand même. | Transition: fjalar_sur
Text: Je vais réfléchir. | Transition: fjalar_bye

[fjalar_bye]
Reviens quand tu veux ! Je serai là. Enfin, je crois. Où suis-je, d'ailleurs ?
Text: Au revoir
