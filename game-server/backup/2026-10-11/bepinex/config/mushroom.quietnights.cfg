## Settings file was created by plugin QuietNights v0.1.0
## Plugin GUID: mushroom.quietnights

[General]

## Master switch. When off, every night spawn behaves as in the unmodded game. Set on the server; connected clients follow it.
# Setting type: Boolean
# Default value: true
Enabled = true

[Rules]

## Creatures whose boss-unlocked night spawns are removed everywhere except at home. Comma-separated Prefab:Biome pairs. A trailing * matches a family of prefabs (Goblin* covers Goblin, GoblinArcher, GoblinShaman, GoblinBrute). Join several home biomes with +, as in Plains+Meadows. Run 'quietnights dump' in the console to see the real prefab names and what each rule catches.
# Setting type: String
# Default value: Goblin*:Plains, Seeker*:Mistlands, Charred*:AshLands
Creatures = Goblin*:Plains, Seeker*:Mistlands, Charred*:AshLands

## Global keys that count as a boss kill. Only spawn entries requiring one of these are touched. Comma-separated; a trailing * matches a prefix.
# Setting type: String
# Default value: defeated_*
BossKeys = defeated_*

