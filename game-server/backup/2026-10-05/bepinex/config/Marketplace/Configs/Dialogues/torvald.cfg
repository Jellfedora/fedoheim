[peche_globes_offre]
Le poisson-globe vit en pleine mer. Il gonfle quand il a peur. Comme Sven. Rapporte-m'en 2.
Text: C'est parti ! | Command: GiveQuest, peche_globes
Text: Plus tard.

[peche_harengs_offre]
Le hareng géant vit en mer, loin des côtes. Rapporte-m'en 2. Oui, géant. Non, il ne mange pas les gens. Normalement.
Text: C'est parti ! | Command: GiveQuest, peche_harengs
Text: Plus tard.

[peche_baudroies_offre]
La baudroie vit dans les eaux des Brumes. Elle a une petite lumière sur la tête. Rapporte-m'en 2.
Text: C'est parti ! | Command: GiveQuest, peche_baudroies
Text: Plus tard.

[peche_magma_offre]
Le poisson de magma vit dans les eaux brûlantes des Terres cendrées. Oui, il y a des poissons dans la lave. Rapporte-m'en 1.
Text: C'est parti ! | Command: GiveQuest, peche_magma
Text: Plus tard.

[torvald_bravo]
Belle prise ! Tiens, ta récompense. Et lave-toi les mains, tu sens le poisson.
Text: Merci !

[torvald_fin]
Tu as pêché ce que je cherchais ! Tu es maintenant un vrai maître pêcheur. Je n'ai plus rien à t'apprendre. Va, et que la mer te soit douce.
Text: Merci !

[torvald_bye]
Reviens quand tu auras quelque chose au bout de ta ligne.
Text: Au revoir
