[ylva_accueil]
Doucement, doucement... Tu vas effrayer mes chevaux. Bonjour, voyageur. Je suis Ylva, la palefrenière. Tu aimes les chevaux ?
Text: Tu as du travail pour moi ? | Condition: !CustomValueMore, cheval_etape, 1 | Condition: NotHasQuest, ylva_selle | AlwaysVisible: false | Transition: ylva_selle_offre
Text: Voilà tes pissenlits ! | Condition: HasQuest, ylva_selle | Condition: HasItem, Dandelion, 50 | AlwaysVisible: false | Command: FinishQuest, ylva_selle | Command: SetCustomValue, cheval_etape, 1 | Transition: ylva_selle_merci
Text: Tu as du travail pour moi ? | Condition: CustomValueMore, cheval_etape, 1 | Condition: !CustomValueMore, cheval_etape, 2 | Condition: NotHasQuest, ylva_cheval | AlwaysVisible: false | Transition: ylva_cheval_offre
Text: Voilà tes pissenlits ! | Condition: HasQuest, ylva_cheval | Condition: HasItem, Dandelion, 50 | AlwaysVisible: false | Command: FinishQuest, ylva_cheval | Command: SetCustomValue, cheval_etape, 2 | Transition: ylva_cheval_merci
Text: Et maintenant ? | Condition: CustomValueMore, cheval_etape, 2 | AlwaysVisible: false | Transition: ylva_fin
Text: On peut apprivoiser un cheval sauvage ? | Transition: ylva_sauvage
Text: Je ne fais que passer. | Transition: ylva_bye

[ylva_selle_offre]
Mes chevaux sont de vrais gourmets : ils ne mangent que des pissenlits. Ramène-m'en 50 et je te donnerai une de mes selles. Les pissenlits poussent un peu partout dans la prairie.
Text: J'y vais ! | Command: GiveQuest, ylva_selle
Text: Plus tard.

[ylva_cheval_offre]
Une selle sans cheval, c'est triste. Ramène-moi encore 50 pissenlits, et je te confierai un de mes chevaux. Il est déjà dressé, il te suivra partout.
Text: J'y vais ! | Command: GiveQuest, ylva_cheval
Text: Plus tard.

[ylva_selle_merci]
Merci ! Ils vont se régaler. Tiens, ta selle. Prends-en soin, je l'ai cousue moi-même. Et si un jour tu veux un cheval pour aller avec... reviens me voir.
Text: Merci !

[ylva_cheval_merci]
Le voilà ! Sois doux avec lui. Pose-lui sa selle, et il t'emmènera où tu veux. Et pense à lui donner des pissenlits, c'est tout ce qu'il mange.
Text: Merci, Ylva !

[ylva_fin]
Comment va ton cheval ? Nourris-le bien avec des pissenlits. Et si tu en croises d'autres dans la prairie, tu sais maintenant comment les amadouer.
Text: Merci !

[ylva_sauvage]
Bien sûr ! Il y a quelques chevaux sauvages dans la prairie, mais ils sont rares. Pose des pissenlits par terre près de lui, recule et laisse-le manger tranquille. Quand il en aura mangé assez, il te fera confiance.
Text: Merci du conseil !

[ylva_bye]
Reviens quand tu veux. Mes chevaux t'aiment bien, je le sens.
Text: Au revoir
