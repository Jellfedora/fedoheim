## Settings file was created by plugin DeathRoulette v1.6.0
## Plugin GUID: geckuss.deathroulette

[Effects]

## Effects for the thunderclap event. Variants separated by '|', prefabs within a variant by '+'. One variant is picked at random and all its prefabs play together at the same spot. Audition any of them live with: server dr fx <name> [more names...] -- reference/effect-prefab-names.txt lists all 1892. Note SpawnObject does a bare Instantiate with no setup, so a prefab whose visual needs runtime configuration (line-renderer endpoints, an Aoe or Projectile owner) will spawn and sound right while rendering wrong; fx_Lightning is exactly that.
# Setting type: String
# Default value: fx_redlightning_burst+fx_chainlightning_hit+fx_lightningweapon_hit|fx_JotunWitch_LightningBolt_Explosion+fx_himminafl_aoe
Thunderclap = fx_redlightning_burst+fx_chainlightning_hit+fx_lightningweapon_hit|fx_JotunWitch_LightningBolt_Explosion+fx_himminafl_aoe

## Effects for the ancient omen event, played at every player. Variants separated by '|', prefabs within a variant by '+'. One variant is picked at random and all its prefabs play together at the same spot. Audition any of them live with: server dr fx <name> [more names...] -- reference/effect-prefab-names.txt lists all 1892. Note SpawnObject does a bare Instantiate with no setup, so a prefab whose visual needs runtime configuration (line-renderer endpoints, an Aoe or Projectile owner) will spawn and sound right while rendering wrong; fx_Lightning is exactly that.
# Setting type: String
# Default value: sfx_frostfoundry_activate
AncientOmen = sfx_frostfoundry_activate

## Effects for the lament event, played at every player. Variants separated by '|', prefabs within a variant by '+'. One variant is picked at random and all its prefabs play together at the same spot. Audition any of them live with: server dr fx <name> [more names...] -- reference/effect-prefab-names.txt lists all 1892. Note SpawnObject does a bare Instantiate with no setup, so a prefab whose visual needs runtime configuration (line-renderer endpoints, an Aoe or Projectile owner) will spawn and sound right while rendering wrong; fx_Lightning is exactly that.
# Setting type: String
# Default value: sfx_gjall_alerted+sfx_gjall_idle_vocals
Lament = sfx_gjall_alerted+sfx_gjall_idle_vocals

## Lightning damage the thunderclap deals to each player. Capped at a quarter of current health, so it can never be the killing blow. 0 disables the damage.
# Setting type: Single
# Default value: 10
ThunderclapDamage = 10

## Status effect the adrenaline event grants for its stamina-regen buff. Must be a vanilla status effect name resolvable by the client's ObjectDB. Note builds after 1.0.7 rename the stamina mead buff to Potion_stamina_medium; the old StaminaMedium name no longer exists and silently no-ops.
# Setting type: String
# Default value: Potion_stamina_medium
AdrenalineBuff = Potion_stamina_medium

[Events]

## Whether the pilgrimage event also respawns the boss at its altar. This can very easily wipe everyone online and leave the gear at an altar far from home. Set false to keep the mass teleport without the boss.
# Setting type: Boolean
# Default value: true
PilgrimageSummonsBoss = true

## How long the loud grief event keeps everyone loud, in seconds. 0 disables the noise entirely (leaving only the optional spawns).
# Setting type: Single
# Default value: 60
LoudGriefDuration = 60

## How loud everyone is. Raised above creature alert ranges it lets creatures hear players through walls and around corners, and the same radius around each player is scanned every few seconds to wake and aggro every live creature there (tamed survivors are spared), so they stop idling and come. 10 is a whisper, 100 is a war horn.
# Setting type: Single
# Default value: 40
LoudGriefNoisePower = 40

## How many extra creatures LoudGriefSpawnPrefab spawns next to every online player while the grief carries. 0 disables outright spawns -- the sound alone is then just an attractor, not a guaranteed fight.
# Setting type: Int32
# Default value: 2
LoudGriefSpawnCount = 2

## Creature spawn noise draws to every player. Any networked prefab is accepted, so late-game worlds can summon something that actually hurts.
# Setting type: String
# Default value: Greyling
LoudGriefSpawnPrefab = Greyling

[General]

## Master switch. When false, deaths are detected but no event fires.
# Setting type: Boolean
# Default value: true
Enabled = true

## Announce who died to everyone. Fires on every death, even when the roulette is disabled or on cooldown.
# Setting type: Boolean
# Default value: true
AnnounceDeaths = true

## Announce which event was rolled, and what it did, to everyone.
# Setting type: Boolean
# Default value: true
AnnounceEffects = true

## Minimum seconds between rolled events, so a wipe does not fire five raids at once.
# Setting type: Single
# Default value: 30
CooldownSeconds = 30

## Seconds of countdown after a death before the rolled event fires. Walks down 3, 2, 1 in the raid-banner slot; 0 disables the delay and fires instantly.
# Setting type: Single
# Default value: 3
CountdownSeconds = 3

## How far back a server-visible hit is still named as the cause in the death announcement. A dedicated server only sees server-owned damage (falling trees, carts, creature projectiles, environment AOEs), so most causes stay generic; 0 disables cause attribution.
# Setting type: Single
# Default value: 5
DeathCauseWindowSeconds = 5

## Log every detected death and roll.
# Setting type: Boolean
# Default value: false
VerboseLogging = false

[Raids]

## Only start raids vanilla considers valid right now, at a position it picks. That respects progression (global keys), biome and base checks, so an early base cannot be handed a late-game raid. Set false to force one from Pool at the corpse regardless of progress.
# Setting type: Boolean
# Default value: true
UseVanillaGating = true

## Comma-separated raid event names the 'raid' event may pick from. Unknown or disabled names are skipped. Leave EMPTY (the default) to allow whatever vanilla currently permits, which is usually what you want with UseVanillaGating on. Boss summons (boss_*, hildirboss1..3) are never offered: vanilla marks them m_random = false and the gating honours that.
# Setting type: String
# Default value: 
Pool = 

