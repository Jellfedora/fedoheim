## Like my mods?
# Setting type: String
# Default value: https://github.com/ZenDragonX/ZenMods_Valheim/wiki
Website = https://github.com/ZenDragonX/ZenMods_Valheim/wiki

[_Debug]

## Generate additional debug information in the logs for this mod.
## This will cause a performance hit and should only be used for debugging.
# Setting type: Boolean
# Default value: false
Enable Logging = false

[General]

## [Admin] List of all the prefabs that are item stands or armor stands.
## These prefabs must have an ItemStand or ArmorStand component attached to them.
# Setting type: StringList
# Default value: itemstand, itemstandh, ArmorStand, Placeable_HardRock
Stand Prefabs = itemstand, itemstandh, ArmorStand, Placeable_HardRock

## [Admin] If enabled you can also use traditional 1-8 hotbar buttons to assign items to stands (Vanilla: true)
# Setting type: Boolean
# Default value: false
Enable Hotbar Use Item = false

[Piece: ArmorStand]

## [Admin] Enable changing poses of armor stands.  NOTE: Stand must have chest and legs armor.
# Setting type: Boolean
# Default value: false
Enable Pose Changing = false

## [Admin] Should (Hold to equip) be available on Armor Stands hover text?
# Setting type: Boolean
# Default value: false
Enable Hold To Equip = false

## [Admin] Enable the use/equip button on armor stands to quickly swap equipped gear.
# Setting type: Boolean
# Default value: true
Enable Use/Equip Button = true

## Change the spelling to 'Armor Stand' instead of 'Armour Stand'
## [Restart required for changes to take effect]
# Setting type: Boolean
# Default value: true
American Spelling = true

[Piece: ItemStand]

## [Admin] Enable the use/equip button on item stands to quickly swap equipped gear.
# Setting type: Boolean
# Default value: true
Enable Use/Equip Button = true

## [Admin] Show the name of the item on the stand in the hover text (Vanilla: true)
## [ZenHoverItem overrides this option]
# Setting type: Boolean
# Default value: true
Show Item Name = true

