Text: Je ne fais que passer. | Transition: hilda_bye

[foret_naingris_offre]
Les nains gris me jettent des cailloux pendant que je coupe du bois. Dix d'entre eux, et je retrouverai le calme. Enfin, presque.
Text: C'est parti ! | Command: GiveQuest, foret_naingris
Text: Plus tard.

[foret_chamans_offre]
Les chamans soignent les petits, et les brutes cognent fort. Abats 3 chamans et 2 brutes de nains gris. Dans cet ordre si tu tiens à tes dents.
Text: C'est parti ! | Command: GiveQuest, foret_chamans
Text: Plus tard.

[foret_squelettes_offre]
Les cryptes débordent de squelettes. 8 d'entre eux, et pense à prendre un gourdin : les os, ça se casse mieux qu'à l'épée.
Text: C'est parti ! | Command: GiveQuest, foret_squelettes
Text: Plus tard.

[foret_ours_offre]
Un ours rôde près de chez moi. Il s'appelle Bjørn. Non, aucun lien avec le forgeron, même si les deux grognent pareil. Débarrasse-moi de lui.
Text: C'est parti ! | Command: GiveQuest, foret_ours
Text: Plus tard.

[foret_trolls_offre]
Deux trolls ont décidé que ma clairière était leur salon. Ils frappent avec des troncs d'arbre. MES troncs d'arbre. Règle-leur leur compte.
Text: C'est parti ! | Command: GiveQuest, foret_trolls
Text: Plus tard.

[foret_ancien_offre]
L'Ancien, l'arbre qui marche, est le maître de cette forêt. Tue-le. Et non, ce n'est pas Sigrid, elle c'est l'Ancienne. Rien à voir. Enfin, pas grand-chose.
Text: C'est parti ! | Command: GiveQuest, foret_ancien
Text: Plus tard.

[hilda_merci]
Bjorn t'envoie ? Ce vieux grincheux a enfin trouvé quelqu'un d'utile. Bienvenue chez moi. J'ai du travail, et pas qu'un peu.
Text: Je t'écoute. | Transition: foret_naingris_offre
Text: Plus tard. | Transition: hilda_bye

[hilda_bravo]
Beau travail ! Voilà ta récompense. Reviens me voir, la liste est encore longue.
Text: Merci !

[hilda_fin]
Tu as abattu l'Ancien ! Mon bois est enfin tranquille. Pour la suite, va voir Gunnar le Pataugeur, dans les Marais. Tu le reconnaîtras à l'odeur. Sans carte, fie-toi à ton nez.
Text: Merci !

[hilda_bye]
Si tu te perds, suis la mousse sur les arbres. Ou pas. Elle pousse de tous les côtés ici.
Text: Au revoir
