Text: Je ne fais que passer. | Transition: olaf_bye

[peche_perches_offre]
Une canne ? Pas si vite. D'abord, montre-moi que tu es débrouillard : ramasse-moi 3 perches de la prairie, sans canne. Comment ? Ça, c'est ton problème. Même un bourgeon y arriverait.
Text: C'est parti ! | Command: GiveQuest, peche_perches
Text: Plus tard.

[peche_perches2_offre]
Pas mal pour un débutant ! Maintenant, prends la canne que je t'ai donnée : lance la ligne dans l'eau, attends, tire. Pêche-moi 10 perches. Et ne les mange pas en route.
Text: C'est parti ! | Command: GiveQuest, peche_perches2
Text: Plus tard.

[peche_brochets_offre]
Les brochets vivent dans les eaux profondes de la prairie et de la Forêt noire. Tes appâts standards feront l'affaire. Pêche-m'en 10. Ils mordent aussi les doigts, fais attention.
Text: C'est parti ! | Command: GiveQuest, peche_brochets
Text: Plus tard.

[olaf_bravo]
Belle prise ! Tiens, ta récompense. Et lave-toi les mains, tu sens le poisson.
Text: Merci !

[olaf_fin]
Tu as l'étoffe d'un pêcheur ! Pour aller plus loin, va trouver Eirik, le maître pêcheur. Il vit dans un petit port à l'est de la stèle d'Eikthyr, là où tu as posé son trophée. Il pêche des choses plus grosses. Beaucoup plus grosses.
Text: Merci !

[olaf_bye]
Reviens quand tu auras quelque chose au bout de ta ligne.
Text: Au revoir

[olaf_reset]
Une canne ? Quelle canne ? Je ne t'ai jamais vu de ma vie. On reprend tout depuis le début !
Text: D'accord
