## Settings file was created by plugin HearthBelow v0.6.2
## Plugin GUID: Azumatt.HearthBelow

[1 - General]

## If on, the configuration is locked and can be changed by server admins only. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Lock Configuration = On

[2 - Digging]

## Master switch. If on, pickaxes carve real holes and tunnels into the terrain - dig sideways into a hillside, hollow out a mountain. If off, digging works like vanilla. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Voxel Digging = On

## Gradual takes a shallow bite in the direction you swing, so repeated hits dig in predictably like vanilla terrain edits do. Blast removes the full Carve Radius in a single hit. [Synced with Server]
# Setting type: DigStyle
# Default value: Gradual
# Acceptable values: Gradual, Blast
Dig Mode = Gradual

## Gradual mode only. How many meters a single pickaxe hit bites into the surface. [Synced with Server]
# Setting type: Single
# Default value: 0.75
# Acceptable value range: From 0,25 to 2
Dig Depth Per Hit = 0.75

## How wide the hole from one pickaxe hit is, in meters. The terrain is sampled every meter, so radii under 1 can miss every sample and report that the ground is too hard. [Synced with Server]
# Setting type: Single
# Default value: 1.6
# Acceptable value range: From 1 to 3
Carve Radius = 1.6

## Cube digs flat floors, walls and ceilings, which is great for building. Sphere digs round, organic looking caves. [Synced with Server]
# Setting type: DigShape
# Default value: Cube
# Acceptable values: Sphere, Cube
Dig Shape = Cube

## How many meters below the original terrain surface you can dig, no matter the tool. Keep this at or above the deepest Tool Tier Depth Limit (default 128 = blackmetal) or the top tiers get silently cut short. Higher values use more memory per dug-out zone. Avoid changing this on a world that already has deep caves. [Synced with Server]
# Setting type: Single
# Default value: 128
# Acceptable value range: From 4 to 256
Max Cave Depth = 128

## If on, better pickaxes dig deeper (see Tool Tier Depth Limits). Digging at a tool's limit leaves a flat, even floor - swapping to a lower tier pickaxe on purpose is a handy way to line up floors for building. If off, every pickaxe digs to Max Cave Depth. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Tool Depth Limits = On

## Tier:meters pairs, comma separated. Tier is the pickaxe's tool tier - the same stat that decides which ores it can mine - so modded pickaxes fit in automatically. Vanilla: 0 = antler/stone, 1 = bronze, 2 = iron, 3 = blackmetal. The defaults are tuned around two anchors: 8m is vanilla's own dig limit (so antler/stone feel vanilla), and 16m is where the cave ambience kicks in - bronze digs to the edge of the dark, iron is the first pickaxe that takes you properly into it, and blackmetal reaches the digging floor. Tiers not listed here follow Extend Tool Tier Limits. [Synced with Server]
# Setting type: String
# Default value: 0:8,1:16,2:48,3:128
Tool Tier Depth Limits = 0:8,1:16,2:48,3:128

## The partner to Tool Tier Depth Limits, for how wide a hole a pickaxe can make. Tier:meters pairs, comma separated, measured across - diameter for a sphere, edge length for a cube - so "0:3,1:4,2:5,3:6" walks antler up to blackmetal. Leave this empty and only Max Player Carve Radius limits size. [Synced with Server]
# Setting type: String
# Default value: 
Tool Tier Size Limits = 

## What happens to a pickaxe whose tool tier is not in the two lists above - a modded flametal pick at tier 4, say. If on, its limit is worked out from the tiers that are listed, following the same step they already climb by, so tier 4 on the default depth list reaches 208m. If off, an unlisted tier digs with no tool limit at all. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Extend Tool Tier Limits = On

## Safety cap on how many dig operations a single 64x64m zone can store. Normal play won't get anywhere near this. [Synced with Server]
# Setting type: Int32
# Default value: 5000
# Acceptable value range: From 100 to 20000
Max Carves Per Zone = 5000

## If on, players can change their own carve radius, dig shape and dig mode on the fly with the dig controls, within the limit set below. If off, everyone digs with the Carve Radius, Dig Shape and Dig Mode set here and the controls do nothing. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Allow Dig Customization = On

## How much harder a bigger dig is on you. A swing's stamina and tool wear are scaled by how much more rock it takes than a default swing, so a wide blast costs several times a narrow scoop and a small dig costs less. 3 makes the cost track the removed volume exactly, 1 is gentle, 0 turns it off and every swing costs the vanilla amount no matter the radius. The scaling tops out at 100x a default swing. Vanilla's own skill discount, equipment modifiers and status effects still apply on top. [Synced with Server]
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 3
Radius Cost Scaling = 2

## How much a bigger dig pays out. A swing's stone and ore drops are scaled by how much more rock it took out than a default swing, the same way Radius Cost Scaling scales what it costs you. 3 makes the drop track the removed volume exactly, so the yield per cubic meter is the same whatever size you dig at, 1 is gentle, 0 turns it off and every swing drops the vanilla amount no matter the radius. A dig smaller than the Carve Radius still drops what vanilla would - this only ever scales a payout up. The scaling tops out at 100x a default swing. [Synced with Server]
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 3
Dig Yield Scaling = 3

## If another terrain mod offers a "remove terrain modifications" tool (Searica's AdvancedTerrainModifiers has one), using it also clears this zone's caves, the same as the 'hearthbelow restore' command. Without this the tool resets the heightmap but the cave stays, because a dug zone is not drawn from that heightmap. Careful either way: restoring a zone entombs anything built in its caves. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Remove Terrain Modifications Clears Caves = On

## Carving has no idea what holds a mountain up, so slicing a chunk out from under an overhang leaves it hanging in mid air. On, a swing also drops any lump of rock it just cut free, along with whatever ore vein was resting on it. Only looks 12m around the hit, so a genuinely huge slab is left where it is - it might be your roof. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Drop Unsupported Terrain = On

## The widest carve radius a player is allowed to pick with the dig controls, in meters. This is the admin cap - it is enforced again on the zone's owner, so a client cannot talk its way past it. Raising it lets people scoop out big rooms fast, which is handy for base builders and much less vanilla; every extra meter also costs more remeshing per swing. [Synced with Server]
# Setting type: Single
# Default value: 3
# Acceptable value range: From 1 to 8
Max Player Carve Radius = 3

[3 - Underground]

## Ambience/weather while you are deep inside a cave, applied the same way vanilla dungeons do it (fades in and out like a weather change). Configuration Manager lists the environments available to the vanilla env command and still accepts typed modded environment names. Not case sensitive. Leave empty to keep the outside weather underground. [Not Synced with Server]
# Setting type: String
# Default value: Darklands_dark
Underground Environment = Darklands_dark

## How many meters below the original surface you must be before the cave ambience starts. Keeps shallow dugouts and walk-in basements feeling like the outdoors. The default 16 lines up with the bronze pickaxe's depth limit, so darkness arrives with iron-tier digging. [Not Synced with Server]
# Setting type: Single
# Default value: 16
# Acceptable value range: From 2 to 32
Underground Environment Depth = 16

## Let hoe paths/paving paint cave floors. Heads up: the game stores terrain paint top-down with no depth, so a painted cave floor also shows on the ground directly above the cave. Turn off if clean surfaces matter more to you than paintable cave floors. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Underground Painting = On

## How enclosed a spot has to be before rain and snow stop reaching you, as a fraction of vanilla's 17 cover rays that must hit rock (vanilla asks 0.8 for a roofed house). Lower it if weather still reaches too far into your caves, raise it if it cuts out too soon after you step inside. [Not Synced with Server]
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0,3 to 1
Cave Weather Shelter Cover = 0.6

## Which of an environment's particle effects rock overhead switches off, matched as comma separated pieces of their names. An environment ships one list holding everything it shows - Rain's is Rain, GroundMist, FogClouds and OceanMist - so this is what separates weather falling out of the sky from ambient effects a cave is meant to keep. Add a name here if another mod's weather still follows you underground. [Not Synced with Server]
# Setting type: String
# Default value: rain,snow,sleet,hail,ash
Cave Weather Particles = rain,snow,sleet,hail,ash

