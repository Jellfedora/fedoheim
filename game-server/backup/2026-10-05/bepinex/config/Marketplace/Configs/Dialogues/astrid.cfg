Text: Et maintenant ? | Condition: CustomValueMore, montagne_etape, 7 | AlwaysVisible: false | Transition: astrid_fin
Text: Je ne fais que passer. | Transition: astrid_bye

[montagne_loups_offre]
Les loups hurlent toute la nuit et je ne dors plus. 6 loups, et je pourrai dormir. Avec une couverture en fourrure, en plus.
Text: C'est parti ! | Command: GiveQuest, montagne_loups
Text: Plus tard.

[montagne_drakes_offre]
Des drakes crachent de la glace sur mon toit. 4 de moins, et il cessera peut-être de fuir.
Text: C'est parti ! | Command: GiveQuest, montagne_drakes
Text: Plus tard.

[montagne_cultistes_offre]
Des cultistes font des rituels dans les grottes. Ils chantent faux. Tue-en 2, pour la musique.
Text: C'est parti ! | Command: GiveQuest, montagne_cultistes
Text: Plus tard.

[montagne_fenring_offre]
Un fenring rôde la nuit, debout sur deux pattes comme un humain mal rasé. Tue-le.
Text: C'est parti ! | Command: GiveQuest, montagne_fenring
Text: Plus tard.

[montagne_golem_offre]
Un golem de pierre garde la montagne. Une pioche, c'est mieux qu'une épée : c'est un caillou, après tout.
Text: C'est parti ! | Command: GiveQuest, montagne_golem
Text: Plus tard.

[montagne_moder_offre]
Moder, la reine des dragons, souffle la tempête sur tout le sommet. Abats-la. Et prends des flèches, beaucoup de flèches.
Text: C'est parti ! | Command: GiveQuest, montagne_moder
Text: Plus tard.

[astrid_merci]
Gunnar t'envoie ? Tu sens encore le marais, ça va me réchauffer le nez. J'ai du travail pour quelqu'un qui n'a pas froid aux yeux.
Text: Je t'écoute. | Transition: montagne_loups_offre
Text: Plus tard. | Transition: astrid_bye

[astrid_bravo]
Beau travail ! Voilà ta récompense. Reviens me voir, la liste est encore longue.
Text: Merci !

[astrid_fin]
Moder est tombée ! Les vents se calment enfin. Pour la suite, descends dans les Plaines voir Ulf le Sec. Emmène de l'eau, il n'en a jamais.
Text: Merci !

[astrid_bye]
Ne lèche pas les rochers gelés. Je parle d'expérience.
Text: Au revoir
