# Default value: true
LogServerStopped = true

## Message posted when the server stops.
# Setting type: String
# Default value: Server stopped.
ServerStoppedTemplate = Serveur arrêté.

## Logs when the world finishes saving. Only fires on the server (or a hosting client).
