Text: Je ne fais que passer. | Transition: ingrid_bye

[brume_lievres_offre]
On commence doucement : 3 lièvres. Oui, ils sont mignons. Non, je n'ai pas pitié. Ils me volent mes champignons.
Text: C'est parti ! | Command: GiveQuest, brume_lievres
Text: Plus tard.

[brume_tiques_offre]
Les tiques sucent le sang de tout ce qui passe. 5 de moins, et je pourrai me balader sans me gratter.
Text: C'est parti ! | Command: GiveQuest, brume_tiques
Text: Plus tard.

[brume_chercheurs_offre]
Les chercheurs. Oui, comme moi. Mais eux, ce sont des insectes géants. 6 d'entre eux, et ne me confonds pas avec eux.
Text: C'est parti ! | Command: GiveQuest, brume_chercheurs
Text: Plus tard.

[brume_soldats_offre]
Les soldats chercheurs sont gros, cuirassés et de mauvaise humeur. 2 d'entre eux. Bonne chance.
Text: C'est parti ! | Command: GiveQuest, brume_soldats
Text: Plus tard.

[brume_gjall_offre]
Un gjall flotte dans les airs et crache des tiques. Oui, il crache des tiques. Abats-le.
Text: C'est parti ! | Command: GiveQuest, brume_gjall
Text: Plus tard.

[brume_reine_offre]
La Reine des chercheurs vit au fond d'une citadelle dvergr. Il te faut une clé, du courage, et beaucoup de potions.
Text: C'est parti ! | Command: GiveQuest, brume_reine
Text: Plus tard.

[ingrid_merci]
Ulf t'envoie ? Il a enfin trouvé de l'eau ? Non ? Pauvre Ulf. J'ai du travail pour toi, si tu supportes les insectes.
Text: Je t'écoute. | Transition: brume_lievres_offre
Text: Plus tard. | Transition: ingrid_bye

[ingrid_bravo]
Beau travail ! Voilà ta récompense. Reviens me voir, la liste est encore longue.
Text: Merci !

[ingrid_fin]
La Reine est tombée ! Les Brumes seront moins bruyantes. Pour la suite, va voir Orm le Brûlé, de l'autre côté de la mer, dans les Terres cendrées. Tu le reconnaîtras : il fume encore.
Text: Merci !

[ingrid_bye]
Garde ta torche allumée. Et ne suis pas les lumières bizarres.
Text: Au revoir
