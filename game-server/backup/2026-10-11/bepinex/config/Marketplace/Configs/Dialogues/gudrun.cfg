[gudrun_accueil]
Ah, un voyageur ! Que les dieux te gardent. Je suis Gudrun. Je m'occupe des offrandes pour la paroisse.
Text: Tu as du travail pour moi ? | Condition: !CustomValueMore, eglise_etape, 1 | Condition: NotHasQuest, eglise_offrandes | AlwaysVisible: false | Transition: gudrun_offre
Text: Où est la paroisse, déjà ? | Condition: HasQuest, eglise_offrandes | AlwaysVisible: false | Transition: gudrun_rappel
Text: Et maintenant ? | Condition: CustomValueMore, eglise_etape, 1 | AlwaysVisible: false | Transition: gudrun_fin
Text: Je ne fais que passer. | Transition: gudrun_bye

[gudrun_offre]
Ça fait des semaines qu'on n'a plus de nouvelles des prêtres de la paroisse, au nord du village après la rivière. D'habitude, frère Ansgar descend chaque semaine chercher des provisions... Ils doivent mourir de faim. Apporte-leur 10 framboises et 5 pots de miel. Et n'y va pas seul : la route n'est plus sûre, il se passe des choses étranges là-bas. Pense à te mettre en groupe avec d'autres voyageurs. Remets les provisions à frère Ansgar, il saura quoi en faire.
Text: J'y vais ! | Command: GiveQuest, eglise_offrandes
Text: Plus tard.

[gudrun_rappel]
Au nord du village, juste après la rivière. Tu ne peux pas la rater, c'est le seul bâtiment avec une cloche. Enfin, normalement.
Text: Merci !

[gudrun_fin]
Frère Ansgar m'a dit que tu les avais aidés. Les dieux te le rendront. Moi aussi, d'ailleurs : je prierai pour toi. Un peu.
Text: Merci, Gudrun !

[gudrun_bye]
Va en paix, voyageur.
Text: Au revoir
