Text: Je ne fais que passer. | Transition: ulf_bye

[plaine_moustiques_offre]
Les moustiques d'ici ne se contentent pas de piquer : ils transpercent. 5 de moins, et je me sentirai mieux. Garde ton bouclier levé.
Text: C'est parti ! | Command: GiveQuest, plaine_moustiques
Text: Plus tard.

[plaine_fulings_offre]
Les fulings pillent tout ce qui brille. Abats-en 10. Et récupère ce qu'ils m'ont volé, si tu trouves.
Text: C'est parti ! | Command: GiveQuest, plaine_fulings
Text: Plus tard.

[plaine_chamans_offre]
Ça te rappelle la forêt ? Même chose ici : 2 chamans fulings et 2 brutes fulings. Mais en plus méchants.
Text: C'est parti ! | Command: GiveQuest, plaine_chamans
Text: Plus tard.

[plaine_lox_offre]
Deux lox piétinent mes champs. Tue-les, ou apprivoise-les, mais c'est plus long.
Text: C'est parti ! | Command: GiveQuest, plaine_lox
Text: Plus tard.

[plaine_goudron_offre]
Des flaques de goudron vivantes collent à tout. 4 d'entre elles, et ne marche pas dedans.
Text: C'est parti ! | Command: GiveQuest, plaine_goudron
Text: Plus tard.

[plaine_yagluth_offre]
Yagluth, le roi déchu des fulings. Il n'a plus de jambes, mais il a encore du caractère. Achève-le.
Text: C'est parti ! | Command: GiveQuest, plaine_yagluth
Text: Plus tard.

[ulf_merci]
Astrid t'envoie ? Elle va bien ? Elle a toujours aussi froid ? Bon, au travail.
Text: Je t'écoute. | Transition: plaine_moustiques_offre
Text: Plus tard. | Transition: ulf_bye

[ulf_bravo]
Beau travail ! Voilà ta récompense. Reviens me voir, la liste est encore longue.
Text: Merci !

[ulf_fin]
Yagluth est tombé ! Les fulings vont enfin se calmer. Pour la suite, va voir Ingrid la Chercheuse aux abords des Brumes. Avec un peu de chance, tu la trouveras... ou elle te trouvera.
Text: Merci !

[ulf_bye]
Fais attention aux moustiques. Ici, une piqûre et c'est fini.
Text: Au revoir
