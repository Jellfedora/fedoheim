[4 - Server Guards]

## Comma separated mod names to accept on name and version alone, without comparing the file. Same version does not mean same bytes: a mod repackaged for Thunderstore, rebuilt from source or shipped by a modpack is a different file and gets refused as modified even though nothing is wrong with it. Put a name here when you trust the mod and only want the version to line up. Matched on the name shown in the refusal message.
# Setting type: String
# Default value: ConfigurationManager, BepInEx.ConfigurationManager
Version Only Mods = ConfigurationManager, BepInEx.ConfigurationManager

## Require a client's mod list and integrity report to answer a challenge this server issued for this connection. Without it a report captured once from a clean client can be replayed forever by anybody. A client running the correct mod always answers correctly, so Report should stay quiet; run it that way for a session before choosing Enforce.
# Setting type: GuardMode
# Default value: Enforce
# Acceptable values: Off, Report, Enforce
Handshake Enforcement = Enforce

## Watch for Valheim's own cheat flag appearing on replicated objects. The game sets it when a player damages something while flying, in god mode, in ghost mode, or swinging a spawned weapon, and when spawned items are put in a container. The server reads it from replicated state, so it does not depend on the client reporting anything. Report logs and reports; Enforce also kicks. Start on Report, because the flag names the object rather than the attacker and attribution is a best guess.
# Setting type: GuardMode
# Default value: Report
# Acceptable values: Off, Report, Enforce
Guard Cheated Objects = Report

## Refuse global keys a client has no legitimate way to set. The allowed set is read out of the prefabs this world loaded, so modded bosses are covered without listing them. Report logs and reports without refusing; run that way first, a wrongly refused key stops progression registering and does it quietly.
# Setting type: GuardMode
# Default value: Report
# Acceptable values: Off, Report, Enforce
Guard Global Keys = Report

## Comma separated extra key names allowed on top of what the prefab scan found. Matched on the key name, so activeBosses also covers 'activeBosses 2'. When a legitimate key gets refused the log names it, paste it in here.
# Setting type: String
# Default value: 
Allowed Client Global Keys = 

## Filter the DestroyZDO message down to objects the sender actually owns or is standing next to. Vanilla deletes everything in the list with no ownership check, which is one packet to flatten a base.
# Setting type: Boolean
# Default value: true
Guard Object Destruction = true

## Refuse the RPC_TeleportPlayer message from non-admins. It moves whoever receives it and can be addressed to everybody at once, which is the one packet way to drop a whole server in the ocean. Vanilla's own admin recall uses it, so admins keep it.
# Setting type: Boolean
# Default value: true
Guard Player Teleport = true

## Report when the display name inside a chat message doesn't match the name the server holds for that connection. The name travels inside the message written by the sender, so it is the easiest thing in the game to lie about.
# Setting type: Boolean
# Default value: true
Report Chat Name Spoofing = true

## Report Harmony patches on a client that come from code which isn't an installed plugin, the BepInEx loader or something a plugin depends on. Cheat menus that load through a proxy DLL such as version.dll patch the game this way without ever appearing in the mod list. Report logs each finding once per player; Enforce kicks. Run it on Report first.
# Setting type: GuardMode
# Default value: Report
# Acceptable values: Off, Report, Enforce
Foreign Code Enforcement = Report

## Comma separated assembly names whose patches the foreign code check accepts, matched against the name in the report. Empty by default because installed plugins and their dependencies are recognized on their own. Only add a name after checking what it is; the name is reported by the player's game, so a cheat could borrow any name on this list.
# Setting type: String
# Default value: 
Allowed Foreign Code = 

## Report players whose position jumps further than walking, portals or a respawn can explain, several times within a few minutes. It only ever reports, never kicks. Portal hops count only between portals the server has linked (any portal when TargetPortal is installed), dungeon entrances are ignored, and a respawn only counts when the old character really died.
# Setting type: Boolean
# Default value: true
Report Speed Hacks = true

## Average speed in meters per second, measured flat across the ground between two readings, above which a reading counts as suspicious. A running player with Eikthyr's power manages about 7.5. Movement that could be a walk to a portal and on from another portal is measured along that route instead.
# Setting type: Single
# Default value: 50
# Acceptable value range: From 10 to 1000
Speed Hack Threshold = 50

## How many suspicious readings within Speed Hack Window Minutes it takes to report. A reading is suspicious when the distance moved since the last one can't be explained by walking, a hop between linked portals or a respawn. Servers running a teleport mod (recall, shrines, map teleport) can raise it to 3 so the odd use doesn't add up; 1 reports every single unexplained jump.
# Setting type: Int32
# Default value: 2
# Acceptable value range: From 1 to 20
Speed Hack Readings Required = 2

## How far back suspicious speed readings are counted. Readings are taken every Check List Interval. A longer window catches someone who spaces their teleports out, at the cost of occasionally adding up legitimate ones.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 1 to 120
Speed Hack Window Minutes = 10

## Report a player who claims and removes an item more than 40m from where the server thinks they are. It only ever reports, never kicks or refuses. Turn it off if it is drowning out everything else on your server.
# Setting type: Boolean
# Default value: true
Report Item Taken At Range = true

## Compare a digest of the client loaded AzuAntiCheat code against the server own copy. The server runs the same DLL, so it knows the answer without asking the client. This is the only integrity check a BepInEx patcher does not pass for free, because a patcher rewrites code on the way into memory and leaves the file on disk untouched. Report logs a mismatch without kicking; run that way first and confirm your own players pass before choosing Enforce.
# Setting type: GuardMode
# Default value: Report
# Acceptable values: Off, Report, Enforce
Enforce Loaded Code Integrity = Report

## Check that a client's Valheim game files match a clean installation. Recompiling assembly_valheim.dll is the bypass that worked against earlier versions of this mod. The reference comes from the client baseline file, which is captured automatically from the first admin to connect, so there is nothing to collect by hand. Off, Report or Enforce.
# Setting type: GuardMode
# Default value: Report
# Acceptable values: Off, Report, Enforce
Game Assembly Enforcement = Report

## Hold clients to the patchers recorded in the client baseline. Patchers load before any plugin and are handed the game's assemblies to rewrite, which is a more powerful position than any plugin has, this one included. Off, Report or Enforce.
# Setting type: GuardMode
# Default value: Report
# Acceptable values: Off, Report, Enforce
Patcher Enforcement = Report

## What happens when somebody connects from a device that cannot install mods. Valheim is crossplay and a console player cannot install BepInEx at all, so requiring the mod from everyone closes the server to consoles. Xbox covers both the console and PC Game Pass and nothing in a connection distinguishes them, so a Game Pass player who installed the mod is treated like any other client and only an Xbox connection without the mod falls under this policy. Every server-side guard still applies to a player who joins without the mod.
# Setting type: CrossplayPolicy
# Default value: RequireModFromEveryone
# Acceptable values: RequireModFromEveryone, AllowConsolesWithoutMod, AllowAnyoneWithoutMod
Crossplay Policy = RequireModFromEveryone

## How many unrelated accounts must report identical game files before that becomes the reference, when no admin has supplied one. Waiting for an admin leaves the check inactive, possibly forever, on a server whose owner rarely plays. Agreement is also harder to poison than a single report: one modified client cannot move a baseline that several honest ones agree on.
# Setting type: Int32
# Default value: 3
# Acceptable value range: From 2 to 10
Baseline Agreement Required = 3

## Capture what a clean client looks like from the first admin to connect after a game update. A dedicated server ships different game assemblies than a client, so this reference cannot come from the server's own files. Turn this off only if you intend to maintain the baseline file by hand.
# Setting type: Boolean
# Default value: true
Learn Baseline From Admins = true

## Check replicated player stats as the client pushes them rather than only on the interval poll. The poll only sees what was true at the tick, so a value set high and put back inside the window slipped through.
# Setting type: Boolean
# Default value: true
Guard Stats On Update = true

## How far from a player an object can be and still be destroyable by them. A player simulates, and can legitimately remove, anything in the 3x3 block of zones around them, which reaches about 181m on the diagonal. 200 covers that plus position lag on a fast ship. Only raise it if you run a mod that enlarges the active area.
# Setting type: Single
# Default value: 200
Object Destruction Proximity = 200

