[peche_morues_offre]
Les perches coralliennes vivent en mer, comme les thons, et mordent aux mêmes appâts lourds. Rapporte-m'en 2. Et si tu croises un serpent de mer, rame vite.
Text: C'est parti ! | Command: GiveQuest, peche_morues
Text: Plus tard.

[peche_globes_offre]
Le poisson-globe vit en pleine mer et dans les eaux profondes des Terres brumeuses. Il gonfle quand il a peur. Comme Eirik. Il te faudra des appâts brumeux. Rapporte-m'en 2.
Text: C'est parti ! | Command: GiveQuest, peche_globes
Text: Plus tard.

[peche_baudroies_offre]
La baudroie vit dans les eaux des Terres brumeuses. Elle a une petite lumière sur la tête. Appâts brumeux, là aussi. Rapporte-m'en 2.
Text: C'est parti ! | Command: GiveQuest, peche_baudroies
Text: Plus tard.

[peche_magma_offre]
Le poisson de magma vit dans les eaux brûlantes des Terres de cendres. Oui, il y a des poissons dans la lave. Il ne mord qu'aux appâts ardents. Rapporte-m'en 1.
Text: C'est parti ! | Command: GiveQuest, peche_magma
Text: Plus tard.

[torvald_bravo]
Belle prise ! Tiens, ta récompense. Et lave-toi les mains, tu sens le poisson.
Text: Merci !

[torvald_fin]
Tu as pêché ce que je cherchais ! Tu es maintenant un vrai maître pêcheur. Je n'ai plus rien à t'apprendre. Va, et que la mer te soit douce.
Text: Merci !

[torvald_bye]
Reviens quand tu auras quelque chose au bout de ta ligne.
Text: Au revoir
