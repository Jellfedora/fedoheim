[sigrid_accueil]
Bienvenue dans ce monde, %playername% ! Tu es tombé du ciel, comme tout le monde ici. Ne t'en fais pas, on s'habitue vite aux corbeaux qui parlent et aux arbres qui t'attaquent.
Text: Tu aurais du travail pour moi ? | Condition: !CustomValueMore, bjorn_etape, 1 | Condition: NotHasQuest, visite_forgeron | AlwaysVisible: false | Transition: sigrid_offre
Text: Où suis-je exactement ? | Transition: sigrid_ou
Text: Merci, à plus tard ! | Transition: sigrid_bye

[sigrid_offre]
Justement ! Bjorn le Forgeron a besoin d'un coup de main. Suis le pont inachevé... oui, celui qui s'arrête en plein milieu, on y travaille depuis trois hivers. Le village est sur l'autre rive. Une carte aurait été bien utile, mais personne n'a encore pensé à en inventer une. Dommage.
Text: J'y vais ! | Command: GiveQuest, visite_forgeron
Text: Plus tard. | Transition: sigrid_bye

[sigrid_ou]
Excellente question. Je te montrerais bien sur une carte, mais personne n'a encore pensé à en inventer une. Retiens juste ceci : le village est de l'autre côté du pont inachevé. Tu ne peux pas le rater... enfin, si, tu peux, mais essaie quand même.
Text: Tu aurais du travail pour moi ? | Condition: !CustomValueMore, bjorn_etape, 1 | Condition: NotHasQuest, visite_forgeron | AlwaysVisible: false | Transition: sigrid_offre
Text: Merci, à plus tard ! | Transition: sigrid_bye

[sigrid_bye]
Bonne route ! Et si tu croises un troll, fais comme moi : cours.
Text: Au revoir
