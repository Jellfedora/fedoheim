[peche_tetras_offre]
Les tétras vivent dans les grottes des montagnes. Oui, des poissons dans des grottes. Ne me demande pas pourquoi. Rapporte-m'en 2.
Text: C'est parti ! | Command: GiveQuest, peche_tetras
Text: Plus tard.

[peche_merous_offre]
Les mérous vivent dans les eaux des Plaines. Rapporte-m'en 2. Attention aux moustiques pendant que tu pêches.
Text: C'est parti ! | Command: GiveQuest, peche_merous
Text: Plus tard.

[peche_thons_offre]
Le thon vit en pleine mer. Prends un bateau, et ne tombe pas à l'eau. Rapporte-m'en 2.
Text: C'est parti ! | Command: GiveQuest, peche_thons
Text: Plus tard.

[peche_morues_offre]
Les morues des coraux vivent en mer, elles aussi. Rapporte-m'en 2. Et si tu croises un serpent de mer, rame vite.
Text: C'est parti ! | Command: GiveQuest, peche_morues
Text: Plus tard.

[sven_bravo]
Belle prise ! Tiens, ta récompense. Et lave-toi les mains, tu sens le poisson.
Text: Merci !

[sven_fin]
Pas mal du tout ! Il ne te reste plus qu'à voir Torvald, le vieux loup de mer. Il pêche dans des eaux où même les poissons ont peur.
Text: Merci !

[sven_bye]
Reviens quand tu auras quelque chose au bout de ta ligne.
Text: Au revoir
