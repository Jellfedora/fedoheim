## Settings file was created by plugin FastLink v1.5.0
## Plugin GUID: Azumatt.FastLink

[Features]

## Ping servers through Steam for online status, player counts, ping, player names and mod checks. Needs Steam (it's skipped automatically on Game Pass/Xbox). Turning it off also turns off everything that depends on it.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Check Server Status = On

## Show the mod mismatch window before joining a server whose published mod list doesn't match yours. Off just joins.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Warn About Mod Mismatches = On

## Joining a full server (or one that's down) waits and joins as soon as it can. Off just tries to join like vanilla.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Join Queue = On

[General]

## Link to the mod page
# Setting type: String
# Default value: https://valheim.thunderstore.io/package/Azumatt/FastLink/
FastLink URL = https://valheim.thunderstore.io/package/Azumatt/FastLink/

## Sorts the Server List Alphabetically. If disabled, the list will be displayed in the same order as the file. NOTE: If you are using colors in your server name, if on, it will still sort but the color you use will have an affect on on the order.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Sort List Alphabetically = On

## Turn on to hide the IP in the connection panel at the main menu. Also hides it in the tooltip
# Setting type: Toggle
# Default value: Off
# Acceptable values: Off, On
Hide the IP in the panel = Off

## Set to true if you want to still show the password prompt to the user. This is for servers that have a password but don't wish to use the file to keep the password.
# Setting type: Toggle
# Default value: Off
# Acceptable values: Off, On
Show Password Prompt = Off

## Set to true if you want to show the password inside the tooltip hover.
# Setting type: Toggle
# Default value: Off
# Acceptable values: Off, On
Show Password In Tooltip = Off

## Press 1-9 at the main menu to join the server with that number in the list. Hold Shift to still get the character select screen.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Number Keys Join Servers = On

## Pre-selects the character you last joined each server with. Set character: in the servers file to skip the character select screen entirely.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Remember Character Per Server = On

## When a server asks for a password and the one you type gets you in, save it to that server's entry so FastLink sends it next time. A saved password the server rejects gets you the prompt again instead of failing every time.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Remember Typed Passwords = On

## Automatically joins the last server you joined through FastLink when the game starts. You can also pick one server in its edit window (On launch). Either way there's a countdown with Cancel and Turn Off, and holding Shift while the main menu loads skips it.
# Setting type: Toggle
# Default value: Off
# Acceptable values: Off, On
Auto Join Last Server = Off

[UI]

## Sets the anchor position of the UI. You can drag it by left clicking on the title and dragging. Manual setting here is also available.
# Setting type: Vector2
# Default value: {"x":429.0,"y":172.0}
Position of the UI = {"x":429.0,"y":172.0}

## Sets the anchor position of the Merch UI. You can drag it by left clicking on the title and dragging. Manual setting here is also available. Vanilla is -200, -155
# Setting type: Vector2
# Default value: {"x":-152.0,"y":270.0}
Position of the Merch UI = {"x":-152.0,"y":270.0}

## Sets the local scale the UI. This is overall size of the UI. Defaults to vanilla JoinGame UI size. I prefer 0.85, 0.85, 0.85
# Setting type: Vector3
# Default value: {"x":1.0,"y":1.0,"z":1.0}
LocalScale of the UI = {"x":1.0,"y":1.0,"z":1.0}

