[Optimizations]

## [Admin] This is the feature master switch.
## By default vanilla broadcasts many RPCs to everyone on the server for even basic things like footsteps or trees growing.
## This feature limits the broadcast of location based RPCs only to players nearby. This reduces network traffic between server and client.
## All ZNetView messages that target Everybody are restricted to only players within the area of the origin.
## (vanilla: false)
# Setting type: Boolean
# Default value: true
Network - RPC NoSpam Everyone - Active = true

## [Admin] Prevent the client from sending messages to the server that target Everybody if nobody else is near the client.
## This reduces client-to-server network traffic when players are isolated in an area.
## [NOTE: if you use EWP the server will not get RPC messages from the client for your server-side scripts if this is enabled]
## (vanilla: false)
## [Network - RPC NoSpam Everyone - Active must be enabled]
# Setting type: Boolean
# Default value: true
Network - RPC NoSpam Everyone - From Client = true

## [Admin] List of additional messages which are not related to ZNetView that still need to be proximity filtered instead of globally broadcast.
## This only affects RPCs which target Everybody.
## [Network - RPC NoSpam Everyone - Active must be enabled]
# Setting type: StringList
# Default value: RPC_DamageText
Network - RPC NoSpam Everyone - Nearby Only = RPC_DamageText

## [Admin] List of RPC messages that are always allowed to be sent to everyone regardless of distance.
## [Network - RPC NoSpam Everyone - Active must be enabled]
# Setting type: StringList
# Default value: RPC_TeleportTo
Network - RPC NoSpam Everyone - Global Allow = RPC_TeleportTo

## [Admin] When this is enabled dedicated servers will send every peer's ZDO data in the same frame update. However, it will increase server work per frame.
## This has no effect on single player games or hosted games.
## NOTE: This is similar to the mod "ReturnToSender" You should not use both this feature and that mod at the same time, pick one.
## Explanation: The vanilla ZDOMan.SendZDOToPeers2 function splits the sending of ZDO data up over multiple frame updates asynchronously.
## That is good if you are playing a hosted game because it will keep your host pc's framerate up when dealing with many peers.
## However, a dedicated server runs headless. spreading the zdo updates over multiple frames can cause clients to have packets arriving a bit later than needed.
## (vanilla: false)
# Setting type: Boolean
# Default value: true
Network - Dedicated Server - SendToPeers Sync = true

